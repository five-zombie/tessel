name: CI & Security Audit

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  check:
    name: Format, Clippy, Test & Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI/GPU build libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libgtk-3-dev
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Performance budget benchmark
        run: cargo bench -p tessel-core --bench perf_budget

  security-audit:
    name: Cargo Audit (CVE Scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Informational "unmaintained" advisories only (no fix available);
          # vulnerabilities still fail the job. Revisit when replacements land.
          ignore: >-
            RUSTSEC-2024-0436,
            RUSTSEC-2026-0192,
            RUSTSEC-2026-0370,
            RUSTSEC-2026-0371,
            RUSTSEC-2026-0372

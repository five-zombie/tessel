name: CI & Cross-Platform Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check-and-test:
    name: Format, Clippy & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace

  release-build:
    name: Build Release Binary (${{ matrix.os }})
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build release binary
        run: cargo build --release -p tessel-app
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessel-${{ matrix.os }}
          path: |
            target/release/tessel
            target/release/tessel.exe
